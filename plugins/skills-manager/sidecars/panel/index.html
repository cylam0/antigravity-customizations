<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skills Manager</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <main class="panel">
    <header class="panel-header">
      <div class="header-left">
        <h1>Skills</h1>
        <span id="skill-count" class="badge">0</span>
      </div>
      <div class="header-actions">
        <button id="btn-new" type="button" class="btn-primary-sm">+ New</button>
        <button id="btn-refresh" type="button" class="btn-icon" title="Refresh list" aria-label="Refresh">↻</button>
      </div>
    </header>

    <div class="filter-bar">
      <input type="search" id="search-input" placeholder="Filter skills by name..." autocomplete="off">
      <div class="scope-tabs" role="tablist">
        <button class="tab-btn active" data-scope="all">All</button>
        <button class="tab-btn" data-scope="global">Global</button>
        <button class="tab-btn" data-scope="workspace">Workspace</button>
        <button class="tab-btn" data-scope="builtin">Built-in</button>
        <button class="tab-btn" data-scope="disabled">Disabled</button>
      </div>
    </div>

    <section id="skills-container" class="skills-container">
      <div id="skills-list" class="skills-list"></div>
      <div id="empty-state" class="empty-state" hidden>No skills found.</div>
    </section>

    <!-- Editor Modal -->
    <div id="editor-modal" class="modal-backdrop" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modal-title">Edit Skill</h2>
          <button id="modal-close" type="button" class="btn-icon" aria-label="Close">✕</button>
        </div>

        <div id="new-skill-meta" class="form-row" hidden>
          <div class="form-group">
            <label for="new-skill-scope">Scope</label>
            <select id="new-skill-scope">
              <option value="global">Global (~/.gemini/config/skills)</option>
              <option value="workspace">Workspace (.agents/skills)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="new-skill-name">Folder / Skill Name</label>
            <input type="text" id="new-skill-name" placeholder="my-skill-name">
          </div>
        </div>

        <div id="validation-banner" class="validation-banner" hidden></div>

        <div class="editor-area">
          <label for="editor-content" class="sr-only">SKILL.md Content</label>
          <textarea id="editor-content" rows="18" spellcheck="false" placeholder="---&#10;name: my-skill&#10;description: ...&#10;---&#10;&#10;# My Skill"></textarea>
        </div>

        <div class="modal-actions">
          <button id="btn-save" type="button">Save</button>
          <button id="btn-cancel" type="button" class="secondary">Cancel</button>
        </div>
      </div>
    </div>

    <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
